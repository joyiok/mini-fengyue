name: story-tavern

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sillytavern:
    image: "${SILLYTAVERN_IMAGE:-ghcr.io/sillytavern/sillytavern}:${SILLYTAVERN_VERSION:-latest}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      SILLYTAVERN_HEARTBEATINTERVAL: "30"
    volumes:
      - ./config:/home/node/app/config:rw
      - ./data:/home/node/app/data:rw
      - ./plugins:/home/node/app/plugins:rw
      - ./extensions:/home/node/app/public/scripts/extensions/third-party:rw
    ports:
      - "${ST_LOCAL_PORT:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *default-logging
    networks:
      - app

  caddy:
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Run as the user that owns ./caddy and ./data, so nothing Caddy writes is
    # root-owned: backup.sh can read the certificates and uninstall.sh can
    # remove them. Docker sets net.ipv4.ip_unprivileged_port_start=0 inside
    # containers, so an unprivileged process can still bind 80/443.
    user: "${PUID:-1000}:${PGID:-1000}"
    # Read-only root filesystem. /data and /config stay writable through the
    # bind mounts below, which is where Caddy keeps certificates and state.
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    depends_on:
      sillytavern:
        condition: service_healthy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-:80}"
      CADDY_EMAIL: "${CADDY_EMAIL:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    # Probes Caddy's local admin API, so it validates the proxy itself rather
    # than depending on APP_DOMAIN resolving. Keep the admin endpoint enabled
    # (it already listens on loopback only).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging: *default-logging
    networks:
      - app

networks:
  app:
    driver: bridge
